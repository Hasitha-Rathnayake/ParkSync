spring.application.name=parksync-backend

# MySQL connection - update if your local setup differs
spring.datasource.url=jdbc:mysql://localhost:3306/parksync_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
